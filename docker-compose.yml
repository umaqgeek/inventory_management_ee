services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      SQLITE_DSN: "file:/app/data/inventory.db?_pragma=busy_timeout(5000)"
      HOLD_DURATION: "2m"
      EXPIRY_SWEEP_PERIOD: "5s"
      SEED_FILE: "/app/seeds/products.json"
    volumes:
      - inventory_data:/app/data

volumes:
  inventory_data:
